  /message/forward:
    post:
      tags:
        - Messages
      summary: "Forward a message to other users"
      description: "Allows a user to forward a message or a photo to one or multiple users."
      operationId: forwardMessage
      security:
        - BearerAuth: []
      requestBody:
        description: "Forward message request details"
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Request object for forwarding a message"
              properties:
                text:
                  type: string
                  description: "The text of the message or the photo path if forwarding an image"
                  example: "Hello, check this out!"
                  minLength: 1
                  maxLength: 1000
                  pattern: "^[\\s\\S]+$"
                isPhoto:
                  type: boolean
                  description: "Indicates whether the forwarded content is a photo"
                  example: false
                users:
                  type: array
                  description: "List of users to whom the message is forwarded"
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    description: "A recipient user object"
                    properties:
                      id:
                        type: integer
                        format: int64
                        description: "ID of the recipient user"
                        example: 12345
                    required:
                      - id
              required:
                - text
                - isPhoto
                - users
      responses:
        '200':
          description: "Message forwarded successfully"
          content:
            application/json:
              schema:
                type: object
                description: "Response indicating the message was forwarded"
                properties:
                  success:
                    type: boolean
                    description: "Indicates if the message was forwarded successfully"
