openapi: 3.0.3
info:
  title: Updated OpenAPI Specification
  description: Fixed based on error report and professor's feedback (ignoring naming convention on verbs).
  version: 1.0.0

tags:
  - name: Users
    description: Operations related to users.
  - name: Messages
    description: Operations related to messages.
  - name: Groups
    description: Operations related to groups.
  - name: Authentication
    description: Authentication operations.
  - name: Health
    description: System health endpoints.

paths:
  /health/alive:
    get:
      tags:
        - Health
      summary: Health check (alive)
      description: Check if the server is alive.
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: integer

  /health/ready:
    get:
      tags:
        - Health
      summary: Health check (ready)
      description: Check if the server is ready.
      responses:
        '200':
          description: Server is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: integer

  /login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate a user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: User's username.
                  minLength: 3
                  maxLength: 50
                  example: "johndoe"
                password:
                  type: string
                  description: User's password.
                  minLength: 6
                  example: "password123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Authentication token.
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"

  /get-users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Retrieve a list of all users.
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /get-conversations:
    post:
      tags:
        - Messages
      summary: Get conversations
      description: Retrieve a list of user conversations.
      responses:
        '200':
          description: A list of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'

  /send-message:
    post:
      tags:
        - Messages
      summary: Send a message
      description: Create a new message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        '201':
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /get-messages:
    post:
      tags:
        - Messages
      summary: Get messages by conversation ID
      description: Retrieve messages from a specific conversation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  type: string
                  description: The ID of the conversation.
                  example: "conv12345"
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'

  /create-group:
    post:
      tags:
        - Groups
      summary: Create a group
      description: Create a new user group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the group.
                  minLength: 3
                  maxLength: 100
                  example: "Study Group"
                members:
                  type: array
                  items:
                    type: string
                    description: IDs of group members.
                    example: "60b8d295f7d1f0001c8e4f3a"
      responses:
        '201':
          description: Group created successfully

  /update-group:
    post:
      tags:
        - Groups
      summary: Update a group
      description: Add users to an existing group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupId:
                  type: string
                  description: The ID of the group to update.
                  example: "grp12345"
                members:
                  type: array
                  items:
                    type: string
                    description: IDs of new members.
                    example: "60b8d295f7d1f0001c8e4f3a"
      responses:
        '200':
          description: Group updated successfully

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the user.
          example: "60b8d295f7d1f0001c8e4f3a"
        name:
          type: string
          description: The name of the user.
          example: "John Doe"
        email:
          type: string
          description: The email address of the user.
          format: email
          example: "johndoe@example.com"

    Message:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the message.
          example: "msg12345"
        content:
          type: string
          description: The content of the message.
          minLength: 1
          maxLength: 1000
          example: "Hello, how are you?"
        senderId:
          type: string
          description: ID of the user who sent the message.
          example: "60b8d295f7d1f0001c8e4f3a"

    Conversation:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the conversation.
          example: "conv12345"
        participants:
          type: array
          items:
            type: string
            description: User IDs of participants.
          example: ["60b8d295f7d1f0001c8e4f3a", "60b8d295f7d1f0001c8e4f4b"]
