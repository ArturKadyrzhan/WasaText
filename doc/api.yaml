openapi: 3.0.0
info:
  title: WasaText API
  description: API documentation for WasaText,describing every method in routes.go by order
  version: "1.0.0"

servers:
  - url: http://localhost:3000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

paths:
  /health/alive:
    get:
      summary: Check if the service is alive.
      operationId: healthCheckAlive
      responses:
        '200':
          description: Service is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error occurred"

  /health/ready:
    get:
      summary: Check if the service is ready.
      operationId: healthCheckReady
      responses:
        '200':
          description: Service is ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  success:
                    type: boolean
                    example: true
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error occurred"

  /login:
    post:
      summary: Authenticate user and get a token.
      operationId: doLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "Artur"
                password:
                  type: string
                  example: "securepassword"
      responses:
        '200':
          description: Successful login.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  username:
                    type: string
                    example: "Artur"
        '400':
          description: Invalid request or missing fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Username or password is missing"
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid username or password"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error occurred"

  /get-users:
    get:
      summary: Get a list of users by search.
      operationId: getUsers
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Search term to filter users.
          schema:
            type: string
      responses:
        '200':
          description: List of users retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        username:
                          type: string

  /get-conversations:
    post:
      summary: Retrieve your all existing conversations (users and groups).
      operationId: getMyConversations
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: List of conversations retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      groups:
                        type: array
                        items:
                          type: object
                          properties:
                            ID:
                              type: integer
                              example: 1
                            Name:
                              type: string
                              example: "Wasa"
                            GroupPhotoURL:
                              type: string
                              example: "webui/public/images/group/1_wasa.jpg"
                      users:
                        type: array
                        items:
                          type: object
                          properties:
                            ID:
                              type: integer
                              example: 2
                            Username:
                              type: string
                              example: "Alina"
                            ProfilePhotoURL:
                              type: string
                              example: "webui/public/images/profile/4_alina.jpg"

  /send-message:
    post:
      summary: Send a message in a conversation.
      operationId: sendMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  type: integer
                senderId:
                  type: integer
                content:
                  type: string
                messageType:
                  type: string
      responses:
        '200':
          description: Message sent successfully.

  /get-messages:
    post:
      summary: Get your messages in chat.
      operationId: getConversation
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  type: integer
      responses:
        '200':
          description: Messages retrieved successfully.

  /mark-as-read:
    post:
      summary: Mark messages as read in a conversation.
      operationId: markAsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  type: integer
                  example: 1
                  description: The ID of the conversation.
                messageIds:
                  type: array
                  items:
                    type: integer
                  example: [ 101, 102, 103 ]
                  description: Array of message IDs to mark as read.
      responses:
        '200':
          description: Messages marked as read successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Invalid request or missing parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "conversationId and messageIds are required"
  /forward-message:
    post:
      summary: Forward a message to another conversation.
      operationId: forwardMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messageId:
                  type: integer
                targetConversationId:
                  type: integer
      responses:
        '200':
          description: Message forwarded successfully.

  /comment-message:
    post:
      summary: Comment on a message.
      operationId: commentMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messageId:
                  type: integer
                comment:
                  type: string
      responses:
        '200':
          description: Comment added to the message successfully.

  /uncomment-message:
    post:
      summary: Remove a comment from a message.
      operationId: uncommentMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messageId:
                  type: integer
      responses:
        '200':
          description: Comment removed successfully.

  /delete-message:
    post:
      summary: Delete a message.
      operationId: deleteMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messageId:
                  type: integer
      responses:
        '200':
          description: Message deleted successfully.

  /update-group:
    post:
      summary: Add users to a group.
      operationId: addToGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupId:
                  type: integer
                userIds:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: Users added to the group successfully.

  /leave-group:
    post:
      summary: Leave a group.
      operationId: leaveGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupId:
                  type: integer
      responses:
        '200':
          description: Left the group successfully.

  /create-group:
    post:
      summary: Create a new group with a name and photo.
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Wasa Group"
                  description: The name of the group.
                groupPhotoURL:
                  type: string
                  format: uri
                  example: "webui/public/images/group/1_group_photo.png"
                  description: The URL of the group photo.
                createdBy:
                  type: integer
                  example: 3
                  description: The ID of the user creating the group.
      responses:
        '200':
          description: Group created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupId:
                    type: integer
                    example: 10
                  name:
                    type: string
                    example: "Wasa Group"
                  groupPhotoURL:
                    type: string
                    format: uri
                    example: "webui/public/images/group/1_group_photo.png"
                  createdBy:
                    type: integer
                    example: 3
                  createdAt:
                    type: string
                    format: date-time
                    example: "2025-01-13T15:30:00Z"
        '400':
          description: Invalid request or missing parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "name and groupPhotoURL are required"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Internal server error occurred"

  /upload-profile-picture:
    post:
      summary: Upload a new profile picture.
      operationId: setMyPhoto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Profile picture uploaded successfully.

