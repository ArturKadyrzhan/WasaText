services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      -  VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./database.db:/app/data/database.db
      - ./webui/public/images:/app/webui/public/images
    networks:
      - app-network

networks:
  app-network:
    driver: bridge




